general {
    lock_cmd = /home/maxik/.local/bin/lock-screen                     # swaylock s tapetou (když už běží, nic nedělá)
    before_sleep_cmd = loginctl lock-session                          # zamknout před uspáním
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' # po probuzení zapnout displej (syntaxe Hyprland 0.56)
    inhibit_sleep = 3                                                 # uspat až ve chvíli, kdy je zámek opravdu nahoře
}

listener {
    timeout = 300                       # 5 min
    on-timeout = loginctl lock-session  # zamknout
}
