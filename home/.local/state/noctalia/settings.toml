[plugins]
enabled = [ "noctalia/wallhaven" ]

[shell]
polkit_agent = true

    [shell.launcher]
    compact = true

    [[shell.session.actions]]
    action = "logout"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "1"
    variant = "default"

    [[shell.session.actions]]
    action = "suspend"
    command = "systemctl suspend"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "2"
    variant = "default"

    [[shell.session.actions]]
    action = "reboot"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "3"
    variant = "default"

    [[shell.session.actions]]
    action = "shutdown"
    countdown_seconds = 0.0
    enabled = true
    shortcut = "5"
    variant = "destructive"

[theme]
builtin = "Ayu"
community_palette = "ADW"
mode = "dark"
pure_black_dark = true
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "foot", "gtk3", "gtk4", "hyprland", "kitty", "qt", "sway" ]
    community_ids = [
        "claude-code",
        "brave",
        "discord",
        "micro",
        "obsidian",
        "vscode",
        "zed",
        "steam",
        "rofi",
        "fastfetch",
        "obs",
        "hyprtoolkit",
        "fzf"
    ]

[wallpaper]
directory = "/home/maxik/Wallpapers"
fill_color = "primary"

    [wallpaper.default]
    path = "/home/maxik/Wallpapers/wallhaven-zpvqmv.png"

    [wallpaper.last]
    path = "/home/maxik/Wallpapers/wallhaven-zpvqmv.png"

    [wallpaper.monitors.eDP-1]
    path = "/home/maxik/Wallpapers/wallhaven-zpvqmv.png"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "/home/maxik/Wallpapers/wallhaven-zpvqmv.png"
    theme_mode = "dark"
    wallpaper_scheme = "m3-content"

[widget.clock]
format = "{:%H:%M:%S}"

[widget.wallhaven]
type = "noctalia/wallhaven:wallhaven"