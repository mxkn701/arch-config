config_version = 16

[audio]
enable_overdrive = true

[bar.default]
background_opacity = 0.36999999172985554
end = [ "tray", "network", "bluetooth", "volume", "brightness", "battery" ]
start = [ "launcher", "wallpaper", "workspaces", "wallhaven", "audio_visualizer" ]

[brightness]
enable_ddcutil = true

[desktop_widgets]
schema_version = 2
widget_order = []

    [desktop_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [desktop_widgets.widget]

[location]
address = ""

[lockscreen]
enabled = false
fingerprint = false
lock_before_suspend = false

